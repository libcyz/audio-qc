name: build-raw

# 原始录音素材校验 (项目B) 单独出包、单独发 Release。
#
# 跟 build.yml (音乐实录/项目A) 完全分开, 互不影响:
#   - 版本标签用 raw-v* 前缀, 不跟项目A 的 v* 抢
#   - Release 挂在 raw-latest / raw-vX.Y 上, 不会覆盖项目A 的 latest
#   - 只编 -p audio_qc_raw, 项目A 的产物不进这条流水线
on:
  push:
    branches: [main]
    tags: ["raw-v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon 机器, 两个架构都能编
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # -p audio_qc_raw 也会连带编 audio_qc 这个库(它是依赖), 所以库里的
      # 解码/DSP 自检一样跑得到
      - name: 算法自检
        run: cargo test -p audio_qc_raw -p audio_qc --release

      - name: 编译两个架构
        run: |
          cargo build -p audio_qc_raw --release --target aarch64-apple-darwin
          cargo build -p audio_qc_raw --release --target x86_64-apple-darwin

      - name: 合成通用二进制并打成 .app
        run: |
          mkdir -p AudioQC-Raw.app/Contents/MacOS
          # lipo 把两个架构合成一个文件, Intel 和 M 系列 Mac 都能跑
          lipo -create -output AudioQC-Raw.app/Contents/MacOS/AudioQC-Raw target/aarch64-apple-darwin/release/audio_qc_raw target/x86_64-apple-darwin/release/audio_qc_raw
          cp packaging/Info-Raw.plist AudioQC-Raw.app/Contents/Info.plist
          chmod +x AudioQC-Raw.app/Contents/MacOS/AudioQC-Raw
          lipo -info AudioQC-Raw.app/Contents/MacOS/AudioQC-Raw

      # 用 .dmg 而不是 .zip: 双击自动挂载, 弹出的窗口里只看得到一个完整的 .app 图标,
      # 不需要"解压"这个动作, 也没法误点进 App 包内部把里面裸的可执行文件当成程序传出去。
      - name: 打成 .dmg
        run: |
          mkdir dmg-root
          cp -R AudioQC-Raw.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "原始素材校验" -srcfolder dmg-root -ov -format UDZO AudioQC-Raw-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: AudioQC-Raw-macOS
          path: AudioQC-Raw-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 算法自检
        run: cargo test -p audio_qc_raw -p audio_qc --release
      - name: 编译
        run: cargo build -p audio_qc_raw --release
      - name: 改个名
        run: Copy-Item target/release/audio_qc_raw.exe AudioQC-Raw.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AudioQC-Raw-Windows
          path: AudioQC-Raw.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 装 GUI 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - name: 算法自检
        run: cargo test -p audio_qc_raw -p audio_qc --release
      - name: 编译
        run: cargo build -p audio_qc_raw --release
      - run: cp target/release/audio_qc_raw AudioQC-Raw-linux
      - uses: actions/upload-artifact@v4
        with:
          name: AudioQC-Raw-Linux
          path: AudioQC-Raw-linux

  # - 打 raw-v1.0 这类标签 → 发对应版本的正式 Release
  # - 推 main(不带标签) → 刷新 "raw-latest" 预发布版
  # 两个 tag_name 都带 raw- 前缀, 跟项目A 的 latest / vX.Y 各占各的, 不会互相覆盖。
  release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AudioQC-Raw-macOS/AudioQC-Raw-macOS.dmg
            AudioQC-Raw-Windows/AudioQC-Raw.exe
            AudioQC-Raw-Linux/AudioQC-Raw-linux
          tag_name: ${{ startsWith(github.ref, 'refs/tags/raw-v') && github.ref_name || 'raw-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/raw-v') && github.ref_name || '原始素材校验 最新构建 (raw-latest)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/raw-v') }}
          body: |
            原始录音素材质量校验工具（**不是**音乐实录那个，那个在 latest / vX.Y 版本里）

            校验：文件类型（WAV/未压缩）、是否立体声、声道数、采样率、时长、
            静音比例、信噪比、频响。

            - macOS: 下载 AudioQC-Raw-macOS.dmg，双击挂载后把 AudioQC-Raw.app
              拖进 Applications 文件夹（弹出的窗口里就这一个图标，别点进去，
              直接拖）。首次打开会提示"无法验证开发者"——“隐私与安全性”——“仍要打开”
              （或终端跑 `xattr -dr com.apple.quarantine /Applications/AudioQC-Raw.app`）。
              这是未签名二进制的正常提示，要消除需要 Apple 开发者证书。
            - Windows: 直接下载 AudioQC-Raw.exe。
            - Linux: 下载 AudioQC-Raw-linux，`chmod +x` 后运行。

            用法：把音频文件或文件夹拖进窗口，结果 CSV 写在拖进来的位置旁边。
