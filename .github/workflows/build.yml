name: build

# 手动点一下、推 main、或者打 v* 标签, 都会出包。
# macOS 那台是苹果自己的云端机器, 所以不需要你有 Mac。
#
# 一次构建出两个程序 (两个项目, 校验项完全不同):
#   audio_qc     -> AudioQC      音乐实录质量校验     (项目A)
#   audio_qc_raw -> AudioQC-Raw  原始录音素材校验     (项目B)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon 机器, 两个架构都能编
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: 算法自检
        run: cargo test --workspace --release

      - name: 编译两个架构
        run: |
          cargo build --workspace --release --target aarch64-apple-darwin
          cargo build --workspace --release --target x86_64-apple-darwin

      # 两个项目各出一个 .app。bundle() 的参数: cargo bin 名 / App 名 / Info.plist
      - name: 合成通用二进制并打成 .app
        run: |
          bundle() {
            mkdir -p "$2.app/Contents/MacOS"
            # lipo 把两个架构合成一个文件, Intel 和 M 系列 Mac 都能跑
            lipo -create -output "$2.app/Contents/MacOS/$2" "target/aarch64-apple-darwin/release/$1" "target/x86_64-apple-darwin/release/$1"
            cp "$3" "$2.app/Contents/Info.plist"
            chmod +x "$2.app/Contents/MacOS/$2"
            lipo -info "$2.app/Contents/MacOS/$2"
          }
          bundle audio_qc     AudioQC     packaging/Info.plist
          bundle audio_qc_raw AudioQC-Raw packaging/Info-Raw.plist

      # 用 .dmg 而不是 .zip: 双击自动挂载, 弹出的窗口里只看得到完整的 .app 图标,
      # 不需要"解压"这个动作, 也没法误点进 App 包内部把里面裸的可执行文件当成程序传出去
      # (这正是"AudioQC 被 TextEdit 打开报编码错误"的成因 —— 传丢的是包里的裸二进制,
      # 不是完整 App)。
      #
      # 两个 App 装在同一个 dmg 里, 只需要一次"挂载-拖进 Applications"的操作,
      # 比发两个 dmg 更不容易让人只装了一个。
      - name: 打成 .dmg
        run: |
          mkdir dmg-root
          cp -R AudioQC.app AudioQC-Raw.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "音频校验" -srcfolder dmg-root -ov -format UDZO AudioQC-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: AudioQC-macOS
          path: AudioQC-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 算法自检
        run: cargo test --workspace --release
      - name: 编译
        run: cargo build --workspace --release
      - name: 改个名
        run: |
          Copy-Item target/release/audio_qc.exe AudioQC.exe
          Copy-Item target/release/audio_qc_raw.exe AudioQC-Raw.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AudioQC-Windows
          path: |
            AudioQC.exe
            AudioQC-Raw.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 装 GUI 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - name: 算法自检
        run: cargo test --workspace --release
      - name: 编译
        run: cargo build --workspace --release
      - run: |
          cp target/release/audio_qc AudioQC-linux
          cp target/release/audio_qc_raw AudioQC-Raw-linux
      - uses: actions/upload-artifact@v4
        with:
          name: AudioQC-Linux
          path: |
            AudioQC-linux
            AudioQC-Raw-linux

  # 每次推送都出包, 不会再跳过 release:
  # - 打 v1.0 这类标签 → 发对应版本的正式 Release
  # - 推 main(不带标签) → 刷新 "latest" 预发布版, 三个平台的包直接挂上去
  release:
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AudioQC-macOS/AudioQC-macOS.dmg
            AudioQC-Windows/AudioQC.exe
            AudioQC-Windows/AudioQC-Raw.exe
            AudioQC-Linux/AudioQC-linux
            AudioQC-Linux/AudioQC-Raw-linux
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '最新构建 (latest)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: |
            音频质量校验工具。**两个程序对应两个不同的项目，校验项完全不同，别拿错：**

            | 程序 | 项目 | 校验什么 |
            |---|---|---|
            | AudioQC | 音乐实录 | 活动比例、人声伴奏分贝差、RT60、截止频率、码率、底噪、峰值、削波 |
            | AudioQC-Raw | 原始录音素材 | WAV/未压缩、立体声、采样率、时长、静音比例、信噪比、频响带宽 |

            - macOS: 下载 AudioQC-macOS.dmg，双击挂载后把里面的 AudioQC.app 和
              AudioQC-Raw.app 都拖进 Applications 文件夹（别点进图标内部，直接拖）。
              首次打开会提示"无法验证开发者"——“隐私与安全性”——“仍要打开”
              （或终端跑 `xattr -dr com.apple.quarantine /Applications/AudioQC.app`）。
              这是未签名二进制的正常提示，要消除需要 Apple 开发者证书。
            - Windows: 直接下载 AudioQC.exe / AudioQC-Raw.exe。
            - Linux: 下载 AudioQC-linux / AudioQC-Raw-linux，`chmod +x` 后运行。

            用法：把音频文件或文件夹拖进窗口，结果 CSV 写在拖进来的位置旁边。
